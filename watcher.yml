name: Alternance Watcher

on:
  schedule:
    - cron: "0 * * * *"  # toutes les heures, pile
  workflow_dispatch: {}   # bouton "Run workflow" manuel sur GitHub

jobs:
  watch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Installer les dépendances
        run: pip install -r requirements.txt

      # seen_offers.db doit survivre d'un run à l'autre pour éviter les doublons.
      # Le cache est écrit avec une clé unique par run et restauré depuis le
      # cache le plus récent qui commence par le même préfixe.
      - name: Restaurer seen_offers.db
        uses: actions/cache@v4
        with:
          path: seen_offers.db
          key: seen-offers-db-${{ github.run_id }}
          restore-keys: |
            seen-offers-db-

      - name: Lancer le watcher
        env:
          LBA_API_TOKEN: ${{ secrets.LBA_API_TOKEN }}
          ADZUNA_APP_ID: ${{ secrets.ADZUNA_APP_ID }}
          ADZUNA_APP_KEY: ${{ secrets.ADZUNA_APP_KEY }}
          JOOBLE_API_KEY: ${{ secrets.JOOBLE_API_KEY }}
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
          CITY: "Caen"
          LATITUDE: "49.2667"
          LONGITUDE: "-0.4500"
          RADIUS_KM: "40"
          ROME_CODES: "M1805,M1802,M1801,M1810,M1806"
          TARGET_DIPLOMA_LEVEL: "6"
          SEARCH_KEYWORDS: "alternance informatique développeur développement web mobile données système réseau"
        run: python main.py
